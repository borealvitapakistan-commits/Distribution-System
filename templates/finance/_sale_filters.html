{# Channel / product / Distributor / batch filters, shared by Reports and the Sales Ledger. Each one applies as soon as it changes. #}
<label>
    Type
    <select name="kind">
        <option value="">All types</option>
        {% for value, label in kinds %}
            <option value="{{ value }}" {% if value == filters.kind %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</label>
<label>
    Product
    <select name="product">
        <option value="">All products</option>
        {% for product in products %}
            <option value="{{ product.pk }}" {% if product.pk|stringformat:"s" == filters.product_id %}selected{% endif %}>{{ product.name }}</option>
        {% endfor %}
    </select>
</label>
<label>
    Distributor
    <select name="distributor">
        <option value="">All Distributors</option>
        {% for distributor in distributors %}
            <option value="{{ distributor.pk }}" {% if distributor.pk|stringformat:"s" == filters.distributor_id %}selected{% endif %}>{{ distributor.name }}</option>
        {% endfor %}
    </select>
</label>
<label>
    Batch
    <select name="batch">
        <option value="">All batches</option>
        {% for code in batches %}
            <option value="{{ code }}" {% if code == filters.batch_number %}selected{% endif %}>{{ code }}</option>
        {% endfor %}
    </select>
</label>
