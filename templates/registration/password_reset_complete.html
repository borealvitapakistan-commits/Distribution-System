{% extends "base.html" %}
{% load static %}

{% block title %}
    Password Updated
{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-brand">
        <img src="{{ brand_logo_url }}" alt="{{ brand.name|default:'Boreal Vita' }}" width="1749" height="496">
    </div>

    <div class="auth-heading">
        <h1>Password updated</h1>

        <p>
            Your password has been changed successfully.
            You can now sign in with your new password.
        </p>
    </div>

    <a
        href="{% url 'login' %}"
        class="button button-primary button-block"
    >
        Sign In
    </a>
</div>
{% endblock %}
