<div class="form-group iw-field{% if field.errors %} iw-field-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="iw-optional">Optional</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
</div>
