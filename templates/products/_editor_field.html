<div class="form-group{% if field.errors %} pc-field-invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="pc-required" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
    {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
</div>
