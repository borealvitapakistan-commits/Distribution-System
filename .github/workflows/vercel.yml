name: Django tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: distribution_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d distribution_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-only-not-a-production-secret-key-0123456789-abcdefghij
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/distribution_ci
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/distribution_ci
      DJANGO_SETTINGS_MODULE: config.test_settings
      USE_S3_STORAGE: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check models and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run all tests against isolated PostgreSQL
        run: python manage.py test --noinput

